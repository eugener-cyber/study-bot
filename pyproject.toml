[project]
name = "studybot"
version = "0.1.0"
description = "Telegram-бот: конспекты, задания и интервальное повторение по учебным материалам"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "black>=24.10",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-socket>=0.7",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bot", "bot.middlewares", "bot.handlers", "core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
# RUF001-003 ловят гомоглифы — кириллические буквы, неотличимые от латинских,
# в преимущественно латинском коде. Проект сознательно русскоязычный:
# комментарии, docstring и тексты для пользователя — на русском, и каждая
# буква «с» или «е» даёт срабатывание. Правило не применимо, а не смягчено.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.black]
line-length = 100
target-version = ["py312"]

# ТЗ §35: mypy --strict на core/. Строгость только там, где живёт бизнес-логика.
[tool.mypy]
python_version = "3.12"
files = ["core"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*", "bot.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: тест, которому нужна сеть. В CI не запускается (ТЗ §36).",
]
