name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    # Решение Архитектора по вопросу 3 плана WP-02: «при отключённой сети» в
    # §41.4 читается как запрет на ВНЕШНЮЮ сеть — её смысл в том, чтобы тесты
    # не ходили к LLM-провайдеру. Service container доступен на 127.0.0.1 и
    # внешней сетью не является. В pytest-socket разрешён ровно этот адрес и
    # только тестам с маркером `db`; без маркера закрыт и loopback, это
    # проверяют канарейки в tests/test_checks_config.py.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Один тест набирает подпись «Рис. N» кириллицей: встроенные шрифты
      # PyMuPDF её не несут (замер: «Рис. 1» извлекается как «···. 1»), а файл
      # шрифта в репозиторий не кладётся (ADR-0007 решение 7). Без этого шага
      # тест пропускался бы, то есть проверка правила §5.2 п. 4 на настоящем
      # разборе PDF не выполнялась бы в CI вовсе — и пропуск выглядел бы
      # зелёным прогоном.
      - name: Установить шрифт с кириллицей
        run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Установить зависимости
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -e ".[dev]"

      # Обязательные переменные §30.2 без значений валят Settings на старте —
      # это правильное поведение, но тестам нужны хоть какие-то. Значения
      # заведомо нерабочие, настоящих секретов в репозитории нет.
      - name: Подставить фиктивное окружение
        run: cp .env.ci .env

      # ТЗ §41.4: CI выполняет то же, что make check. Цепочка не дублируется.
      - name: make check
        run: make check
